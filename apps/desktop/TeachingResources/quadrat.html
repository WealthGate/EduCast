<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quadrat sampling</title>
    <link rel="stylesheet" href="resource.css">
    <style>#field { touch-action: none; cursor: crosshair; }</style>
    <script defer src="instrument.js"></script>
    <script defer src="quadrat.js"></script>
</head>
<body class="instrument">
    <header>
        <h1>Quadrat sampling</h1>
        <p>Sample a simulated patch of plants and estimate the density.</p>
    </header>
    <nav class="toolbar" aria-label="Sampling controls">
        <button id="random">Random position</button>
        <button id="record" class="primary">Record sample</button>
        <button id="reset">Clear samples</button>
        <button id="newField">New field</button>
    </nav>
    <main>
        <figure class="panel">
            <canvas id="field" tabindex="0" aria-label="Simulated plants in an eight by six metre field. Click or use arrow keys to move the quadrat."></canvas>
        </figure>
        <aside class="panel" aria-label="Sampling results">
            <label>Quadrat side <output id="sizeValue"></output>
                <input id="size" type="range" min=".5" max="3" value="1" step=".25">
            </label>
            <div class="readout">Latest sample <output id="last">—</output></div>
            <div class="readout">Samples recorded <output id="samples">0</output></div>
            <div class="readout">Estimated density <output id="density">—</output></div>
        </aside>
    </main>
    <footer>Density is total individuals counted divided by total sampled area. Take several randomly placed samples. <a href="https://openstax.org/books/biology-2e/pages/45-1-population-demography">Quadrat sampling reference</a></footer>
</body>
</html>
